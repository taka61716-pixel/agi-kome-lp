<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>阿木ファーム LINEリッチメニュー</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 2500px; height: 1686px; overflow: hidden; }
      body {
        color: #f7f2e7;
        font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: #193c2c;
      }
      .menu {
        width: 2500px;
        height: 1686px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        background:
          linear-gradient(rgba(8, 28, 18, .32), rgba(8, 28, 18, .52)),
          url("agi-line-richmenu-background.png") center / cover;
      }
      .item {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 24px;
        text-align: center;
        border-right: 1px solid rgba(247, 242, 231, .55);
        border-bottom: 1px solid rgba(247, 242, 231, .55);
        background: linear-gradient(145deg, rgba(12, 39, 26, .18), rgba(0, 0, 0, .2));
      }
      .item:nth-child(3n) { border-right: 0; }
      .item:nth-child(n+4) { border-bottom: 0; }
      .icon { font-family: Georgia, serif; font-size: 78px; line-height: 1; color: #e8d49c; }
      .label { font-size: 58px; font-weight: 700; letter-spacing: .08em; text-shadow: 0 3px 20px rgba(0, 0, 0, .7); }
      .sub { font-size: 27px; letter-spacing: .12em; color: rgba(247, 242, 231, .9); }
      .brand { position: absolute; top: 43px; left: 60px; font-family: Georgia, serif; font-size: 28px; letter-spacing: .2em; }
    </style>
  </head>
  <body>
    <div class="menu">
      <span class="brand">AGI FARM / あぎひかり</span>
      <section class="item"><span class="icon">01</span><span class="label">予約相談</span><span class="sub">希望数量を送る</span></section>
      <section class="item"><span class="icon">02</span><span class="label">価格・送料</span><span class="sub">購入前の確認</span></section>
      <section class="item"><span class="icon">03</span><span class="label">収穫・発送</span><span class="sub">お届け時期</span></section>
      <section class="item"><span class="icon">04</span><span class="label">あぎひかり</span><span class="sub">産地と米づくり</span></section>
      <section class="item"><span class="icon">05</span><span class="label">公式サイト</span><span class="sub">商品と予約案内</span></section>
      <section class="item"><span class="icon">06</span><span class="label">お問い合わせ</span><span class="sub">ご質問はこちら</span></section>
    </div>
  </body>
</html>
